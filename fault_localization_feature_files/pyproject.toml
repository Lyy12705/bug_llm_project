[project]
name = "bug-tracking-llm-system"
version = "0.1.0"
description = "Integrated bug tracking and repair pipeline following bug_tracking_llm_system_code_flow_plan.md."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
ml = [
  "joblib>=1.3",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14",
  "scikit-learn>=1.3",
  "requests>=2.31",
]
fault-localization = [
  "sentence-transformers>=2.7",
]
datasets = [
  "pandas>=2.0",
  "pyarrow>=14",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
