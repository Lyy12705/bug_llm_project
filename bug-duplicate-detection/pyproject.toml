[project]
name = "duplicate-ticket-detection"
version = "0.1.0"
description = "Duplicate ticket detection pipeline based on title/content embeddings and ranking evaluation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
sbert = [
  "accelerate>=1.1",
  "datasets>=2.18",
  "sentence-transformers>=3.0",
  "torch>=2.0",
]

[project.scripts]
duplicate-ticket = "duplicate_ticket_detection.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
