[project]
name = "bug-tracking-llm-system"
version = "0.1.0"
description = "Integrated bug tracking and repair pipeline following bug_tracking_llm_system_code_flow_plan.md."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
bug-tracking-llm = "bug_tracking_llm_system.cli:main"

[project.optional-dependencies]
ml = [
  "joblib>=1.3",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14",
  "scikit-learn>=1.3",
  "requests>=2.31",
]
fault-localization = [
  "sentence-transformers>=2.7",
]
datasets = [
  "pandas>=2.0",
  "pyarrow>=14",
]
dev = [
  "coverage[toml]>=7.6",
  "pytest>=8.0",
  "ruff>=0.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["config", "main"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prompts = ["*.txt"]

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
