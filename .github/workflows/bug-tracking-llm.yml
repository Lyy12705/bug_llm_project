name: Bug Tracking LLM CI

on:
  push:
    paths:
      - "bug_tracking_llm_system/**"
      - ".github/workflows/bug-tracking-llm.yml"
  pull_request:
    paths:
      - "bug_tracking_llm_system/**"
      - ".github/workflows/bug-tracking-llm.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: bug_tracking_llm_system

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: bug_tracking_llm_system/pyproject.toml
      - name: Install package and development checks
        run: python -m pip install -e ".[dev]"
      - name: Verify installed package and CLI
        run: |
          python -c "import bug_tracking_llm_system; from bug_tracking_llm_system import PipelineConfig"
          bug-tracking-llm --help
      - name: Compile and lint
        run: |
          python -m compileall -q src scripts tests
          ruff check src scripts/evaluate_integrated_baselines.py scripts/create_fault_localization_frozen_split.py scripts/manage_artifact_cache.py tests
      - name: Unit and integration tests with coverage
        run: |
          coverage run -m unittest discover -s tests
          coverage report
      - name: Integrated baseline smoke metrics
        run: python scripts/evaluate_integrated_baselines.py
